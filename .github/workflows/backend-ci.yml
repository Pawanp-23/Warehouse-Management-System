name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB replica set
        run: docker compose -f infra/docker-compose.yml up -d mongo

      - name: Run transactional inventory tests
        run: >-
          docker compose -f infra/docker-compose.yml run --rm
          -e MONGO_TEST_URI='mongodb://mongo:27017/?replicaSet=rs0'
          api python -m pytest tests -q

      - name: Build API image
        run: docker compose -f infra/docker-compose.yml build api
